<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>골라골라 랜덤주사위</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #EEEBFA;
    --panel: #FFFFFF;
    --ink: #241F4A;
    --muted: #6B6890;
    --line: #DCD7F2;
    --floor: #DDD7F5;
    --shadow: rgba(36, 31, 74, .55);
    --c0: #FF5C7A; --c0b: #FF9AAD; --c0d: #C93252;
    --c1: #FFB020; --c1b: #FFD36E; --c1d: #C27D00;
    --c2: #6FCF3F; --c2b: #AEEA86; --c2d: #3F9A1A;
    --c3: #17C3B2; --c3b: #67E8D8; --c3d: #0C8D80;
    --c4: #3D8BFF; --c4b: #86B8FF; --c4d: #1F5FC7;
    --c5: #8B5CF6; --c5b: #BBA0FF; --c5d: #5B33BD;
    --s: 150px;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #13112B; --panel: #1E1B40; --ink: #F1EFFF; --muted: #A9A5D0; --line: #34305F; --floor: #25214D; --shadow: rgba(0, 0, 0, .7);
    }
  }
  :root[data-theme="dark"] {
    --bg: #13112B; --panel: #1E1B40; --ink: #F1EFFF; --muted: #A9A5D0; --line: #34305F; --floor: #25214D; --shadow: rgba(0, 0, 0, .7);
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  *, *::before, *::after { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    min-height: 100vh;
  }
  .app { max-width: 1060px; margin: 0 auto; padding: 28px 20px 48px; }
  header h1 { font-family: "Jua", "Noto Sans KR", sans-serif; font-weight: 400; font-size: clamp(30px, 5vw, 44px); margin: 0 0 6px; letter-spacing: .01em; }
  header p { margin: 0; color: var(--muted); font-size: 15px; }

  .board { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 20px; margin-top: 22px; }
  @media (max-width: 760px) { .board { grid-template-columns: 1fr; } :root { --s: 124px; } }

  /* 주사위 무대 */
  .stage {
    position: relative;
    height: 430px;
    perspective: 1000px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 28px;
    overflow: hidden;
  }
  @media (max-width: 760px) { .stage { height: 380px; } }
  .floor {
    position: absolute; left: 50%; top: 66%;
    width: 86%; height: 34%;
    transform: translateX(-50%);
    background: radial-gradient(ellipse at center, var(--floor) 0%, transparent 68%);
    pointer-events: none;
  }
  .shadow {
    position: absolute; left: 50%; top: calc(62% + var(--s) / 2 + 6px);
    width: calc(var(--s) * 1.05); height: calc(var(--s) * .26);
    margin-left: calc(var(--s) * -.525);
    background: radial-gradient(ellipse at center, var(--shadow) 0%, transparent 70%);
    filter: blur(3px);
    pointer-events: none;
  }
  .die-btn {
    position: absolute; left: 50%; top: 62%;
    width: var(--s); height: var(--s);
    margin: calc(var(--s) / -2) 0 0 calc(var(--s) / -2);
    padding: 0; border: 0; background: none; cursor: pointer;
    transform-style: preserve-3d;
    -webkit-tap-highlight-color: transparent;
    border-radius: 20px;
  }
  .die-btn:focus-visible { outline: 3px solid var(--c4); outline-offset: 14px; }
  .die-btn:disabled { cursor: default; }
  .die { position: absolute; inset: 0; transform-style: preserve-3d; will-change: transform; }

  .face, .core {
    position: absolute; inset: 0;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
  }
  .face {
    border-radius: 22px;
    display: flex; align-items: center; justify-content: center;
    text-align: center;
    padding: 10px;
    font-family: "Jua", "Noto Sans KR", sans-serif;
    color: #fff;
    text-shadow: 0 2px 0 rgba(0, 0, 0, .22), 0 3px 10px rgba(0, 0, 0, .25);
    word-break: keep-all;
    overflow-wrap: anywhere;
    line-height: 1.12;
    box-shadow: inset 0 0 0 3px rgba(255, 255, 255, .28), inset 0 -14px 26px rgba(0, 0, 0, .18), inset 0 12px 20px rgba(255, 255, 255, .16);
  }
  .face::after {
    content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
    background: radial-gradient(circle at 24% 18%, rgba(255, 255, 255, .5) 0%, rgba(255, 255, 255, 0) 42%);
  }
  .face span { position: relative; z-index: 1; }
  .core { inset: 4px; }

  .face[data-i="0"] { transform: translateZ(calc(var(--s) / 2)); }
  .face[data-i="1"] { transform: rotateY(180deg) translateZ(calc(var(--s) / 2)); }
  .face[data-i="2"] { transform: rotateY(90deg) translateZ(calc(var(--s) / 2)); }
  .face[data-i="3"] { transform: rotateY(-90deg) translateZ(calc(var(--s) / 2)); }
  .face[data-i="4"] { transform: rotateX(90deg) translateZ(calc(var(--s) / 2)); }
  .face[data-i="5"] { transform: rotateX(-90deg) translateZ(calc(var(--s) / 2)); }
  .core[data-i="0"] { transform: translateZ(calc(var(--s) / 2 - 5px)); }
  .core[data-i="1"] { transform: rotateY(180deg) translateZ(calc(var(--s) / 2 - 5px)); }
  .core[data-i="2"] { transform: rotateY(90deg) translateZ(calc(var(--s) / 2 - 5px)); }
  .core[data-i="3"] { transform: rotateY(-90deg) translateZ(calc(var(--s) / 2 - 5px)); }
  .core[data-i="4"] { transform: rotateX(90deg) translateZ(calc(var(--s) / 2 - 5px)); }
  .core[data-i="5"] { transform: rotateX(-90deg) translateZ(calc(var(--s) / 2 - 5px)); }

  .face[data-i="0"] { background: linear-gradient(145deg, var(--c0b), var(--c0)); } .core[data-i="0"] { background: var(--c0d); }
  .face[data-i="1"] { background: linear-gradient(145deg, var(--c1b), var(--c1)); } .core[data-i="1"] { background: var(--c1d); }
  .face[data-i="2"] { background: linear-gradient(145deg, var(--c2b), var(--c2)); } .core[data-i="2"] { background: var(--c2d); }
  .face[data-i="3"] { background: linear-gradient(145deg, var(--c3b), var(--c3)); } .core[data-i="3"] { background: var(--c3d); }
  .face[data-i="4"] { background: linear-gradient(145deg, var(--c4b), var(--c4)); } .core[data-i="4"] { background: var(--c4d); }
  .face[data-i="5"] { background: linear-gradient(145deg, var(--c5b), var(--c5)); } .core[data-i="5"] { background: var(--c5d); }

  .throw {
    position: absolute; left: 50%; bottom: 20px; transform: translateX(-50%);
    font: inherit; font-family: "Jua", "Noto Sans KR", sans-serif; font-size: 22px;
    color: #fff; border: 0; border-radius: 999px; padding: 12px 34px; cursor: pointer;
    background: linear-gradient(135deg, #FF5C7A, #8B5CF6);
    box-shadow: 0 8px 20px rgba(139, 92, 246, .38);
    transition: transform .12s ease, box-shadow .12s ease, opacity .2s;
  }
  .throw:hover:not(:disabled) { transform: translateX(-50%) translateY(-2px); }
  .throw:active:not(:disabled) { transform: translateX(-50%) translateY(1px); box-shadow: 0 3px 10px rgba(139, 92, 246, .38); }
  .throw:disabled { opacity: .6; cursor: default; }
  .throw:focus-visible { outline: 3px solid var(--c4); outline-offset: 4px; }

  /* 결과 패널 */
  .result {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 28px;
    padding: 22px;
    display: flex; flex-direction: column;
    min-height: 430px;
  }
  @media (max-width: 760px) { .result { min-height: 0; } }
  .result h2 { margin: 0; font-size: 15px; font-weight: 500; color: var(--muted); }
  .big-wrap { flex: 1; display: flex; align-items: center; justify-content: center; min-height: 190px; padding: 10px 0; }
  .big {
    font-family: "Jua", "Noto Sans KR", sans-serif;
    text-align: center; line-height: 1.1;
    word-break: keep-all; overflow-wrap: anywhere;
    max-width: 100%;
    color: var(--muted);
    font-size: 30px;
  }
  .big.hasresult { color: var(--rc, var(--ink)); }
  .big.pop { animation: pop .55s cubic-bezier(.2, 1.6, .4, 1); }
  @keyframes pop { 0% { transform: scale(.4); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
  .count { color: var(--muted); font-size: 14px; margin: 0 0 10px; min-height: 1.4em; }
  .history { display: flex; flex-wrap: wrap; gap: 6px; min-height: 30px; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 13px; padding: 4px 10px 4px 8px;
    border: 1px solid var(--line); border-radius: 999px;
    max-width: 100%;
  }
  .chip i { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .chip b { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* 입력 */
  .editor {
    margin-top: 20px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 28px;
    padding: 22px;
  }
  .editor-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
  .editor-head h2 { margin: 0; font-size: 18px; }
  .editor-head p { margin: 0; color: var(--muted); font-size: 14px; }
  .fields { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
  @media (max-width: 760px) { .fields { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 420px) { .fields { grid-template-columns: 1fr; } }
  .field { position: relative; }
  .field i { position: absolute; left: 12px; top: 50%; width: 16px; height: 16px; margin-top: -8px; border-radius: 50%; pointer-events: none; }
  .field input {
    width: 100%; font: inherit; font-size: 16px; color: var(--ink);
    background: transparent; border: 2px solid var(--line); border-radius: 14px;
    padding: 12px 12px 12px 38px; outline: none;
    transition: border-color .15s;
  }
  .field input:focus-visible { border-color: var(--fc); }
  .field input::placeholder { color: var(--muted); opacity: .7; }
  .reset {
    font: inherit; font-size: 14px; color: var(--muted); background: none;
    border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; cursor: pointer;
  }
  .reset:hover { color: var(--ink); border-color: var(--muted); }
  .reset:focus-visible { outline: 3px solid var(--c4); outline-offset: 2px; }

  @media (prefers-reduced-motion: reduce) { .big.pop { animation: none; } }
</style>
</head>
<body>
<main class="app">
  <header>
    <h1>골라골라 랜덤주사위</h1>
    <p>여섯 면에 원하는 글자를 적고, 주사위를 눌러 던져 보세요.</p>
  </header>

  <section class="board">
    <div class="stage" id="stage">
      <div class="floor"></div>
      <div class="shadow" id="shadow"></div>
      <button class="die-btn" id="dieBtn" aria-label="주사위 던지기">
        <div class="die" id="die"></div>
      </button>
      <button class="throw" id="throwBtn">주사위 던지기</button>
    </div>

    <aside class="result" aria-live="polite">
      <h2>결과</h2>
      <div class="big-wrap"><div class="big" id="big">주사위를 던져 보세요</div></div>
      <p class="count" id="count"></p>
      <div class="history" id="history"></div>
    </aside>
  </section>

  <section class="editor">
    <div class="editor-head">
      <div>
        <h2>주사위 면 글자</h2>
        <p>입력하면 주사위에 바로 반영됩니다. 칸마다 색이 다릅니다.</p>
      </div>
      <button class="reset" id="resetBtn" type="button">기본값으로 되돌리기</button>
    </div>
    <div class="fields" id="fields"></div>
  </section>
</main>

<script>
(function () {
  var DEFAULTS = ['치킨', '피자', '떡볶이', '삼겹살', '초밥', '라면'];
  var COLORS = ['#FF5C7A', '#FFB020', '#6FCF3F', '#17C3B2', '#3D8BFF', '#8B5CF6'];
  var STORE_KEY = 'custom-dice-faces-v1';

  var dieEl = document.getElementById('die');
  var dieBtn = document.getElementById('dieBtn');
  var throwBtn = document.getElementById('throwBtn');
  var shadowEl = document.getElementById('shadow');
  var stageEl = document.getElementById('stage');
  var bigEl = document.getElementById('big');
  var countEl = document.getElementById('count');
  var historyEl = document.getElementById('history');
  var fieldsEl = document.getElementById('fields');
  var resetBtn = document.getElementById('resetBtn');

  var values = DEFAULTS.slice();
  var faceTextEls = [];
  var inputs = [];
  var history = [];
  var total = 0;
  var rolling = false;

  /* ---------- 저장 / 불러오기 ---------- */
  function loadValues() {
    try {
      var raw = localStorage.getItem(STORE_KEY);
      if (!raw) return;
      var arr = JSON.parse(raw);
      if (Array.isArray(arr) && arr.length === 6) {
        values = arr.map(function (v) { return String(v).slice(0, 14); });
      }
    } catch (e) { /* 저장소를 쓸 수 없는 경우 무시 */ }
  }
  function saveValues() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(values)); } catch (e) { /* 무시 */ }
  }

  /* ---------- 주사위 / 입력칸 만들기 ---------- */
  function fitFace(i) {
    var t = values[i].trim();
    var n = t.length;
    var size = n <= 1 ? 62 : n <= 2 ? 48 : n <= 3 ? 40 : n <= 4 ? 33 : n <= 6 ? 26 : n <= 9 ? 20 : 16;
    var scale = window.innerWidth <= 760 ? 0.82 : 1;
    faceTextEls[i].style.fontSize = Math.round(size * scale) + 'px';
    faceTextEls[i].textContent = t || '\u00B7';
  }

  function build() {
    for (var i = 0; i < 6; i++) {
      var core = document.createElement('div');
      core.className = 'core';
      core.setAttribute('data-i', i);
      dieEl.appendChild(core);

      var face = document.createElement('div');
      face.className = 'face';
      face.setAttribute('data-i', i);
      var span = document.createElement('span');
      face.appendChild(span);
      dieEl.appendChild(face);
      faceTextEls.push(span);

      var wrap = document.createElement('label');
      wrap.className = 'field';
      wrap.style.setProperty('--fc', COLORS[i]);
      var dot = document.createElement('i');
      dot.style.background = COLORS[i];
      var inp = document.createElement('input');
      inp.type = 'text';
      inp.maxLength = 14;
      inp.placeholder = (i + 1) + '번째 면';
      inp.setAttribute('aria-label', (i + 1) + '번째 면 글자');
      inp.value = values[i];
      (function (idx) {
        inp.addEventListener('input', function () {
          values[idx] = inputs[idx].value;
          fitFace(idx);
          saveValues();
        });
      })(i);
      wrap.appendChild(dot);
      wrap.appendChild(inp);
      fieldsEl.appendChild(wrap);
      inputs.push(inp);
      fitFace(i);
    }
  }

  /* ---------- 3x3 회전 행렬 도구 (CSS 좌표계와 동일) ---------- */
  function Rx(a) { var c = Math.cos(a), s = Math.sin(a); return [1, 0, 0, 0, c, -s, 0, s, c]; }
  function Ry(a) { var c = Math.cos(a), s = Math.sin(a); return [c, 0, s, 0, 1, 0, -s, 0, c]; }
  function Rz(a) { var c = Math.cos(a), s = Math.sin(a); return [c, -s, 0, s, c, 0, 0, 0, 1]; }
  function mul(a, b) {
    var r = new Array(9);
    for (var i = 0; i < 3; i++) for (var j = 0; j < 3; j++) {
      r[i * 3 + j] = a[i * 3] * b[j] + a[i * 3 + 1] * b[3 + j] + a[i * 3 + 2] * b[6 + j];
    }
    return r;
  }
  function transpose(m) { return [m[0], m[3], m[6], m[1], m[4], m[7], m[2], m[5], m[8]]; }
  function axisAngleMatrix(ax, ang) {
    var x = ax[0], y = ax[1], z = ax[2];
    var c = Math.cos(ang), s = Math.sin(ang), t = 1 - c;
    return [
      c + x * x * t, x * y * t - z * s, x * z * t + y * s,
      y * x * t + z * s, c + y * y * t, y * z * t - x * s,
      z * x * t - y * s, z * y * t + x * s, c + z * z * t
    ];
  }
  function matrixToAxisAngle(m) {
    var w, x, y, z, s;
    var tr = m[0] + m[4] + m[8];
    if (tr > 0) {
      s = Math.sqrt(tr + 1) * 2; w = 0.25 * s;
      x = (m[7] - m[5]) / s; y = (m[2] - m[6]) / s; z = (m[3] - m[1]) / s;
    } else if (m[0] > m[4] && m[0] > m[8]) {
      s = Math.sqrt(1 + m[0] - m[4] - m[8]) * 2;
      w = (m[7] - m[5]) / s; x = 0.25 * s; y = (m[1] + m[3]) / s; z = (m[2] + m[6]) / s;
    } else if (m[4] > m[8]) {
      s = Math.sqrt(1 + m[4] - m[0] - m[8]) * 2;
      w = (m[2] - m[6]) / s; x = (m[1] + m[3]) / s; y = 0.25 * s; z = (m[5] + m[7]) / s;
    } else {
      s = Math.sqrt(1 + m[8] - m[0] - m[4]) * 2;
      w = (m[3] - m[1]) / s; x = (m[2] + m[6]) / s; y = (m[5] + m[7]) / s; z = 0.25 * s;
    }
    if (w < 0) { w = -w; x = -x; y = -y; z = -z; }
    w = Math.min(1, w);
    var ang = 2 * Math.acos(w);
    var sn = Math.sqrt(1 - w * w);
    if (sn < 1e-6) return [[1, 0, 0], 0];
    return [[x / sn, y / sn, z / sn], ang];
  }
  function css3d(m) {
    return 'matrix3d(' + m[0] + ',' + m[3] + ',' + m[6] + ',0,' + m[1] + ',' + m[4] + ',' + m[7] + ',0,' + m[2] + ',' + m[5] + ',' + m[8] + ',0,0,0,0,1)';
  }

  /* 각 면이 정면을 향하게 하는 회전 */
  var FACE_ROT = [
    [1, 0, 0, 0, 1, 0, 0, 0, 1],
    Ry(Math.PI),
    Ry(-Math.PI / 2),
    Ry(Math.PI / 2),
    Rx(-Math.PI / 2),
    Rx(Math.PI / 2)
  ];

  /* 현재 방향(처음엔 3면이 보이도록 비스듬히) */
  var C = mul(Rx(-0.5), Ry(0.62));
  function place(m, x, y, sc) {
    dieEl.style.transform = 'translate3d(' + x.toFixed(1) + 'px,' + (-y).toFixed(1) + 'px,0) scale(' + sc.toFixed(3) + ') ' + css3d(m);
  }
  function placeShadow(x, h) {
    var k = Math.max(0, 1 - h / 320);
    shadowEl.style.transform = 'translateX(' + x.toFixed(1) + 'px) scale(' + (0.55 + 0.45 * k).toFixed(3) + ')';
    shadowEl.style.opacity = (0.25 + 0.75 * k).toFixed(3);
  }
  place(C, 0, 0, 1);
  placeShadow(0, 0);

  /* ---------- 던지기 ---------- */
  function randInt(n) {
    if (window.crypto && crypto.getRandomValues) {
      var a = new Uint32Array(1);
      crypto.getRandomValues(a);
      return a[0] % n;
    }
    return Math.floor(Math.random() * n);
  }
  function rand(a, b) { return a + Math.random() * (b - a); }

  function throwDie() {
    if (rolling) return;
    rolling = true;
    throwBtn.disabled = true;
    dieBtn.disabled = true;
    bigEl.classList.remove('pop');

    var reduced = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
    var picked = randInt(6);
    var tilt = rand(-0.2, 0.2);
    var F = mul(Rz(tilt), FACE_ROT[picked]);
    var D = mul(F, transpose(C));
    var aa = matrixToAxisAngle(D);
    var axis = aa[0], ang = aa[1];

    var TWO_PI = Math.PI * 2;
    function spin() { return (Math.random() < 0.5 ? -1 : 1) * TWO_PI * (reduced ? 0 : (3 + randInt(2))); }
    var A1 = spin(), A2 = spin(), A3 = spin();

    /* 튕김 구간: 던져 올린 뒤 점점 낮게 통통 튄다 */
    var g = 2600;
    var H = reduced ? 60 : rand(215, 245);
    var segs = [], tt = 0;
    while (H > 3) {
      var dur = 2 * Math.sqrt(2 * H / g);
      segs.push({ t0: tt, dur: dur, H: H });
      tt += dur;
      H *= 0.46;
    }
    var totalT = Math.max(tt, 0.6);
    var maxX = Math.min(150, stageEl.clientWidth * 0.3);
    var x0 = (Math.random() < 0.5 ? -1 : 1) * rand(maxX * 0.7, maxX);
    var start = performance.now();

    function frame(now) {
      var t = (now - start) / 1000;
      var p = Math.min(1, t / totalT);
      var s = 1 - Math.pow(1 - p, 1.7);

      var h = 0;
      for (var i = 0; i < segs.length; i++) {
        var sg = segs[i];
        if (t >= sg.t0 && t < sg.t0 + sg.dur) {
          var u = (t - sg.t0) / sg.dur;
          h = 4 * sg.H * u * (1 - u);
          break;
        }
      }
      var x = x0 * Math.pow(1 - p, 2);
      var Rt = mul(mul(Rx(A1 * s), Ry(A2 * s)), Rz(A3 * s));
      var O = mul(Rt, mul(axisAngleMatrix(axis, ang * s), C));

      if (p >= 1) {
        C = F;
        place(F, 0, 0, 1);
        placeShadow(0, 0);
        finish(picked);
        return;
      }
      place(O, x, h, 1 + h / 420);
      placeShadow(x, h);
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  }

  /* ---------- 결과 표시 ---------- */
  function showResult(text, color) {
    var n = text.length;
    var size = n <= 1 ? 150 : n <= 2 ? 124 : n <= 3 ? 100 : n <= 4 ? 82 : n <= 6 ? 62 : n <= 9 ? 46 : 34;
    if (window.innerWidth <= 760) size = Math.round(size * 0.66);
    bigEl.style.fontSize = size + 'px';
    bigEl.style.setProperty('--rc', color);
    bigEl.textContent = text;
    bigEl.classList.add('hasresult');
    void bigEl.offsetWidth;
    bigEl.classList.add('pop');
  }

  function renderHistory() {
    historyEl.textContent = '';
    history.slice(-10).reverse().forEach(function (h) {
      var chip = document.createElement('span');
      chip.className = 'chip';
      var dot = document.createElement('i');
      dot.style.background = h.color;
      var b = document.createElement('b');
      b.textContent = h.text;
      chip.appendChild(dot);
      chip.appendChild(b);
      historyEl.appendChild(chip);
    });
  }

  function finish(idx) {
    var text = values[idx].trim() || '(빈 면)';
    var color = COLORS[idx];
    total += 1;
    history.push({ text: text, color: color });
    showResult(text, color);
    countEl.textContent = '지금까지 ' + total + '번 던졌어요';
    renderHistory();
    rolling = false;
    throwBtn.disabled = false;
    dieBtn.disabled = false;
  }

  /* ---------- 이벤트 ---------- */
  dieBtn.addEventListener('click', throwDie);
  throwBtn.addEventListener('click', throwDie);
  resetBtn.addEventListener('click', function () {
    values = DEFAULTS.slice();
    for (var i = 0; i < 6; i++) { inputs[i].value = values[i]; fitFace(i); }
    saveValues();
  });
  window.addEventListener('resize', function () { for (var i = 0; i < 6; i++) fitFace(i); });

  loadValues();
  build();
})();
</script>
